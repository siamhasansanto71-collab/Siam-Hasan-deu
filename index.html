    <script>
      // Prevent service worker update failures from causing unhandled rejection errors
      window.addEventListener('unhandledrejection', (event) => {
        if (event && event.reason && (
          String(event.reason).includes('ServiceWorker') ||
          String(event.reason).includes('sw.js')
        )) {
          console.warn('Silenced ServiceWorker update rejection:', event.reason);
          event.preventDefault();
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          try {
            // Unregister any stale or query-parameterized service workers
            if (navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then((registrations) => {
                for (const reg of registrations) {
                  const url = reg.active?.scriptURL || reg.waiting?.scriptURL || reg.installing?.scriptURL || '';
                  if (url.includes('?v=') || url.includes('/sw.js?')) {
                    reg.unregister().catch(() => {});
                  }
                }
              }).catch(() => {});
            }

            // Register standard canonical /sw.js with safe promise handling
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then((reg) => {
                console.log('PWA Service Worker registered with scope:', reg.scope);
                if (reg && typeof reg.update === 'function') {
                  reg.update().catch(() => {});
                }
              })
              .catch((err) => {
                console.warn('PWA Service Worker registration notice:', err);
              });
          } catch (err) {
            console.warn('ServiceWorker initialization skipped:', err);
          }
        });
      }
    </script>
